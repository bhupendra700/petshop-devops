name: ECS CD

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "nginx/**"
  #     - "frontend/**"
  #     - "backend/**"
  #     - ".github/workflows/ecs-cd.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECS_CLUSTER: petshop-cluster

jobs:
  deploy:
    name: Deploy on ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/ecs
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/ecs
        env:
          TF_VAR_mongodb_atlas_public_key: ${{ secrets.MONGODB_ATLAS_PUBLIC_KEY }}
          TF_VAR_mongodb_atlas_private_key: ${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}
          TF_VAR_atlas_project_id: ${{ secrets.MONGODB_ATLAS_PROJECT_ID }}
          TF_VAR_mongodb_database_username: ${{ secrets.MONGODB_DATABASE_USERNAME }}
          TF_VAR_mongodb_database_password: ${{ secrets.MONGODB_DATABASE_PASSWORD }}
        run: terraform apply -auto-approve

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push all images to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "=== 1. Building and pushing Backend ==="
          docker build -t $REGISTRY/petshop-backend:latest ./backend
          docker push $REGISTRY/petshop-backend:latest

          echo "=== 2. Building and pushing Frontend ==="
          docker build -t $REGISTRY/petshop-frontend:latest ./frontend
          docker push $REGISTRY/petshop-frontend:latest

          echo "=== 3. Building and pushing Nginx ==="
          docker build -f ./nginx/Dockerfile.ecs -t $REGISTRY/petshop-nginx:latest ./nginx
          docker push $REGISTRY/petshop-nginx:latest

      - name: Start ECS services
        run: |
          aws ecs update-service --cluster $ECS_CLUSTER --service petshop-nginx --desired-count 2 --force-new-deployment
          aws ecs update-service --cluster $ECS_CLUSTER --service petshop-frontend --desired-count 2 --force-new-deployment
          aws ecs update-service --cluster $ECS_CLUSTER --service petshop-backend --desired-count 2 --force-new-deployment

      # - name: Wait for services to stabilize
      #   run: |
      #     aws ecs wait services-stable --cluster $ECS_CLUSTER --services petshop-nginx petshop-frontend petshop-backend