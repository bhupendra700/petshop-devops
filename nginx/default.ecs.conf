server {
    listen 80;

    # Frontend
    location / {
        proxy_pass http://frontend.petshop.local:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Backend
    location /api/ {
        proxy_pass http://backend.petshop.local:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}