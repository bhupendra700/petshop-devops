server {
    listen 80;

    # VPC DNS resolver (VPC CIDR 10.0.0.0/16 hai to .2 hi hota hai)
    resolver 10.0.0.2 valid=10s;

    location /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Frontend
    location / {
        set $frontend http://frontend.petshop.local:3000;
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Backend
    location /api/ {
        set $backend http://backend.petshop.local:5000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}