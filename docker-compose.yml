services:
  database:
    build:
      context: .
      dockerfile_inline: "FROM mongo:latest"
    image: mongodb
    container_name: mongodb-con
    networks:
      - petshop-network
    volumes:
      - ./mongo_data/db:/data/db
      - ./mongo_data/configdb:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: backend
    container_name: backend-con
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    networks:
      - petshop-network

    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: frontend
    container_name: frontend-con

    ports:
      - "3000:3000"
    env_file:
      - frontend/.env
    networks:
      - petshop-network
    depends_on:
      - backend

  nginx:
    image: nginx:latest
    container_name: nginx-con

    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - petshop-network
    depends_on:
      - backend
      - frontend

networks:
  petshop-network:
    driver: bridge
